name: ghcr-image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    # Path filters do not apply to tag pushes, so releases always build.
    paths-ignore:
      - "*.md"
      - "wiki/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "wiki/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to the same branch or PR supersedes the running build, which
# also keeps an older master build from overwriting `edge`. Release tags are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build And Push To GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Image Name And Version
        id: prep
        run: |
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "build_version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "build_version=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # master: edge, sha-<short>
      # vX.Y.Z: X.Y.Z, X.Y, latest
      # vX.Y.Z-rc1: X.Y.Z-rc1 only (prereleases skip X.Y and latest)
      # PR: pr-<number>, built but never pushed
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.prep.outputs.image }}
          # latest=auto adds `latest` only for stable semver tags, never for master.
          flavor: |
            latest=auto
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=EPUSDT
            org.opencontainers.image.description=Self-hosted crypto payment gateway with built-in ChainScanner
          annotations: |
            org.opencontainers.image.title=EPUSDT
            org.opencontainers.image.description=Self-hosted crypto payment gateway with built-in ChainScanner

      - name: Login To GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            API_RATE_URL=${{ vars.API_RATE_URL }}
            BUILD_VERSION=${{ steps.prep.outputs.build_version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
